<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Antigravity 3D Chessboard Environment</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Three.js and OrbitControls from CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 50% 30%, #f7f3eb 0%, #e5dec9 100%);
      --hud-bg: rgba(247, 243, 235, 0.88);
      --hud-border: rgba(40, 35, 30, 0.2);
      --accent: #2b2725;
      --accent-hover: #1c1917;
      --text-main: #1c1917;
      --text-muted: #66605b;
    }

    [data-theme="vintage"] {
      --bg-gradient: radial-gradient(circle at 50% 30%, #f4efe6 0%, #dcd0bc 100%);
      --hud-bg: rgba(245, 240, 232, 0.85);
      --hud-border: rgba(60, 45, 30, 0.15);
      --accent: #8b5a2b;
      --accent-hover: #6e441f;
      --text-main: #292524;
      --text-muted: #78716c;
    }

    [data-theme="porcelain"] {
      --bg-gradient: radial-gradient(circle at 50% 30%, #2a2a40 0%, #12121e 100%);
      --hud-bg: rgba(20, 20, 35, 0.65);
      --hud-border: rgba(255, 255, 255, 0.12);
      --accent: #10b981;
      --accent-hover: #059669;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    [data-theme="cyber"] {
      --bg-gradient: radial-gradient(circle at 50% 30%, #0f172a 0%, #020617 100%);
      --hud-bg: rgba(15, 23, 42, 0.75);
      --hud-border: rgba(56, 189, 248, 0.2);
      --accent: #0284c7;
      --accent-hover: #0369a1;
      --text-main: #f0f9ff;
      --text-muted: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      outline: none !important;
    }

    canvas, div, img, button, select {
      outline: none !important;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-drag: none;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: #e5dec9;
      background: var(--bg-gradient);
      color: var(--text-main);
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      transition: background 0.4s ease, color 0.4s ease;
    }

    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* UI Overlay Panel */
    .hud {
      position: relative;
      z-index: 10;
      pointer-events: none;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 1.5rem;
    }

    .hud-header {
      pointer-events: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--hud-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--hud-border);
      padding: 0.85rem 1.5rem;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand h1 {
      font-family: 'Cinzel', serif;
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--text-main);
      text-transform: uppercase;
    }

    .controls-top {
      display: flex;
      align-items: center;
      gap: 0.85rem;
    }

    .select-input, .btn {
      background: rgba(0, 0, 0, 0.05);
      border: 1px solid var(--hud-border);
      color: var(--text-main);
      padding: 0.5rem 0.9rem;
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      outline: none !important;
      transition: all 0.2s ease;
    }

    .select-input option {
      background: #f7f3eb;
      color: #1c1917;
    }

    .btn:hover, .select-input:hover {
      background: rgba(0, 0, 0, 0.1);
      border-color: rgba(0, 0, 0, 0.25);
    }

    .hud-footer {
      pointer-events: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--hud-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--hud-border);
      padding: 0.75rem 1.25rem;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
      width: max-content;
      margin: 0 auto;
    }

    .camera-tools {
      display: flex;
      gap: 0.5rem;
    }

    @media (max-width: 768px) {
      .hud-header { flex-direction: column; gap: 0.75rem; }
    }
  </style>
</head>
<body>

  <div id="canvas-container"></div>

  <!-- HUD Interface -->
  <div class="hud">
    <div class="hud-header">
      <div class="brand">
        <span style="font-size: 1.5rem;">🎲</span>
        <h1>3D Chessboard Environment</h1>
      </div>

      <div class="controls-top">
        <select id="boardTheme" class="select-input" onchange="changeTheme()">
          <option value="woodcut" selected>Vintage Engraved Woodcut</option>
          <option value="vintage">Natural Boxwood & Rosewood</option>
          <option value="porcelain">Cobalt Porcelain</option>
          <option value="cyber">Midnight Cyber</option>
        </select>
      </div>
    </div>

    <div class="hud-footer">
      <div class="camera-tools">
        <button class="btn" onclick="setCameraView('perspective')">📷 3D View</button>
        <button class="btn" onclick="setCameraView('top')">⬇️ Top View</button>
        <button class="btn" onclick="setCameraView('flip')">🔄 Flip Perspective</button>
      </div>
    </div>
  </div>

  <script>
    // --- THREE.JS SCENE, LIGHTING, 3D BOARD, AND ORBIT CONTROLS ---
    let scene, camera, renderer, controls;
    let squareMeshes = [];
    let currentTheme = 'woodcut';

    let matLightSquare, matDarkSquare, matFrame, matFrameGold;

    function applyThemeMaterials(themeName) {
      if (themeName === 'porcelain') {
        matLightSquare = new THREE.MeshStandardMaterial({ color: 0xedd6b1, roughness: 0.35 });
        matDarkSquare = new THREE.MeshStandardMaterial({ color: 0x3d2817, roughness: 0.4 });
        matFrame = new THREE.MeshStandardMaterial({ color: 0x1f140e, roughness: 0.2 });
        matFrameGold = new THREE.MeshStandardMaterial({ color: 0xd4af37, roughness: 0.3, metalness: 0.8 });
        if (scene) scene.background = new THREE.Color(0x12121e);
      } else if (themeName === 'cyber') {
        matLightSquare = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.2 });
        matDarkSquare = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.3 });
        matFrame = new THREE.MeshStandardMaterial({ color: 0x020617, roughness: 0.1 });
        matFrameGold = new THREE.MeshStandardMaterial({ color: 0x38bdf8, roughness: 0.2, metalness: 0.9 });
        if (scene) scene.background = new THREE.Color(0x020617);
      } else if (themeName === 'vintage') {
        matLightSquare = new THREE.MeshStandardMaterial({ color: 0xf2e6ce, roughness: 0.35 });
        matDarkSquare = new THREE.MeshStandardMaterial({ color: 0x7a5230, roughness: 0.4 });
        matFrame = new THREE.MeshStandardMaterial({ color: 0x4a301c, roughness: 0.35 });
        matFrameGold = new THREE.MeshStandardMaterial({ color: 0xc69214, roughness: 0.3, metalness: 0.7 });
        if (scene) scene.background = new THREE.Color(0xdcd0bc);
      } else {
        // 'woodcut' - Vintage Woodcut Engraving
        matLightSquare = new THREE.MeshStandardMaterial({ color: 0xf7f3eb, roughness: 0.3 });
        matDarkSquare = new THREE.MeshStandardMaterial({ color: 0x3c3836, roughness: 0.35 });
        matFrame = new THREE.MeshStandardMaterial({ color: 0x1c1917, roughness: 0.25 });
        matFrameGold = new THREE.MeshStandardMaterial({ color: 0x78716c, roughness: 0.3, metalness: 0.5 });
        if (scene) scene.background = new THREE.Color(0xe5dec9);
      }
    }

    applyThemeMaterials('woodcut');

    function initThreeJS() {
      const container = document.getElementById('canvas-container');

      // 1. Create Scene
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0xe5dec9);

      // 2. Perspective Camera
      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 8.5, 9.5);

      // 3. WebGL Renderer
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.appendChild(renderer.domElement);

      // 4. OrbitControls (Rotate, Pan, Zoom)
      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.maxPolarAngle = Math.PI / 2 - 0.05;
      controls.minDistance = 4;
      controls.maxDistance = 20;

      // 5. Lighting Setup (Ambient & Directional Light)
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xfff5ea, 1.25);
      dirLight.position.set(6, 12, 8);
      dirLight.castShadow = true;
      dirLight.shadow.mapSize.width = 2048;
      dirLight.shadow.mapSize.height = 2048;
      dirLight.shadow.bias = -0.0005;
      scene.add(dirLight);

      const fillLight = new THREE.DirectionalLight(0x80b3ff, 0.45);
      fillLight.position.set(-6, 8, -6);
      scene.add(fillLight);

      // 6. Build 3D Board
      buildBoard3D();

      window.addEventListener('resize', onWindowResize);
    }

    function buildBoard3D() {
      const existingFrame = scene.getObjectByName("boardFrame");
      if (existingFrame) scene.remove(existingFrame);

      const boardGroup = new THREE.Group();
      boardGroup.name = "boardFrame";

      // Outer Wood Frame Slab
      const frameGeo = new THREE.BoxGeometry(9.6, 0.4, 9.6);
      const frameMesh = new THREE.Mesh(frameGeo, matFrame);
      frameMesh.position.y = -0.22;
      frameMesh.receiveShadow = true;
      boardGroup.add(frameMesh);

      // Inner Gold Trim Border
      const trimGeo = new THREE.BoxGeometry(8.5, 0.38, 8.5);
      const trimMesh = new THREE.Mesh(trimGeo, matFrameGold);
      trimMesh.position.y = -0.20;
      boardGroup.add(trimMesh);

      // 64 Alternating 3D Square Boxes
      squareMeshes = [];
      for (let r = 0; r < 8; r++) {
        squareMeshes[r] = [];
        for (let c = 0; c < 8; c++) {
          const isLight = (r + c) % 2 === 0;
          const sqGeo = new THREE.BoxGeometry(1, 0.2, 1);
          const sqMesh = new THREE.Mesh(sqGeo, isLight ? matLightSquare : matDarkSquare);
          sqMesh.position.set(c - 3.5, 0.0, r - 3.5);
          sqMesh.receiveShadow = true;
          sqMesh.userData = { row: r, col: c };
          boardGroup.add(sqMesh);
          squareMeshes[r][c] = sqMesh;
        }
      }

      scene.add(boardGroup);
    }

    function changeTheme() {
      currentTheme = document.getElementById('boardTheme').value;
      document.body.setAttribute('data-theme', currentTheme);
      applyThemeMaterials(currentTheme);
      buildBoard3D();
    }

    function setCameraView(view) {
      if (view === 'perspective') {
        camera.position.set(0, 8.5, 9.5);
      } else if (view === 'top') {
        camera.position.set(0, 12, 0.01);
      } else if (view === 'flip') {
        camera.position.set(0, 8.5, -9.5);
      }
      camera.lookAt(0, 0, 0);
      controls.target.set(0, 0, 0);
      controls.update();
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    initThreeJS();
    animate();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chess.com 2D Baseline - FIDE & AI Engine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- chess.js FIDE engine CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      outline: none !important;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: #302e2b;
      color: #ffffff;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app-layout {
      display: flex;
      gap: 2rem;
      align-items: center;
      justify-content: center;
      max-width: 1200px;
      width: 95%;
      height: 90vh;
    }

    /* Centered 2D Chessboard Container */
    .board-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .chessboard {
      width: 600px;
      height: 600px;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
      border: 4px solid #262421;
    }

    .sq {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .sq.light {
      background-color: #eeeed2;
    }

    .sq.dark {
      background-color: #769656;
    }

    .sq.selected {
      background-color: #bbcb2b !important;
    }

    .sq.in-check {
      background-color: #eb4747 !important;
    }

    .piece-img {
      width: 85%;
      height: 85%;
      object-fit: contain;
      pointer-events: auto;
      cursor: grab;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
    }

    .piece-img:active {
      cursor: grabbing;
    }

    .legal-dot {
      width: 22px;
      height: 22px;
      background: rgba(0, 0, 0, 0.18);
      border-radius: 50%;
      pointer-events: none;
    }

    .legal-ring {
      width: 100%;
      height: 100%;
      border: 6px solid rgba(0, 0, 0, 0.18);
      border-radius: 50%;
      pointer-events: none;
      position: absolute;
    }

    /* Side Control Panel (Chess.com Vibe) */
    .sidebar {
      background: #262421;
      border-radius: 16px;
      width: 360px;
      height: 600px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 1.5rem;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.35);
    }

    .brand-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .brand-header img {
      width: 38px;
      height: 38px;
      object-fit: contain;
    }

    .brand-header h1 {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      color: #81b64c;
      text-transform: uppercase;
    }

    .controls-group {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      margin-top: 1rem;
    }

    .control-label {
      font-size: 0.8rem;
      font-weight: 600;
      color: #bababa;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .select-input, .btn {
      background: #302e2b;
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #ffffff;
      padding: 0.65rem 1rem;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      width: 100%;
    }

    .select-input option {
      background: #262421;
      color: #ffffff;
    }

    .btn:hover, .select-input:hover {
      background: #3d3a37;
      border-color: rgba(255, 255, 255, 0.25);
    }

    .btn-primary {
      background: #81b64c;
      color: #ffffff;
      border: none;
    }

    .btn-primary:hover {
      background: #a3d166;
    }

    .btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.6rem;
    }

    .status-box {
      background: #302e2b;
      border-radius: 10px;
      padding: 0.85rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .turn-indicator {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.95rem;
      font-weight: 700;
    }

    .turn-badge {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #ffffff;
      border: 1px solid #1c1917;
    }

    .turn-badge.black {
      background: #1c1917;
    }

    .check-badge {
      background: #dc2626;
      color: #fff;
      font-size: 0.75rem;
      font-weight: 800;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      display: none;
    }

    .move-log {
      max-height: 120px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 0.85rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.35rem 0.75rem;
      background: #302e2b;
      padding: 0.6rem;
      border-radius: 8px;
    }

    .move-item {
      background: rgba(255, 255, 255, 0.05);
      padding: 0.25rem 0.4rem;
      border-radius: 4px;
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .captured-tray {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      min-height: 36px;
    }

    .captured-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.2rem;
      min-height: 18px;
    }

    .captured-row img {
      width: 20px;
      height: 20px;
      object-fit: contain;
    }

    .ai-thinking {
      display: none;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      color: #eab308;
    }

    /* Modal Overlays */
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
    }

    .modal-card {
      background: #262421;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 2rem;
      text-align: center;
      max-width: 420px;
      width: 90%;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
    }

    .modal-card h2 {
      font-size: 1.6rem;
      margin-bottom: 0.5rem;
      color: #81b64c;
    }

    .promo-options {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.75rem;
      margin-top: 1rem;
    }

    .promo-btn {
      background: #302e2b;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      padding: 0.85rem 0.5rem;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
    }

    .promo-btn img {
      width: 42px;
      height: 42px;
      object-fit: contain;
    }

    .promo-btn:hover {
      background: #81b64c;
    }

    @media (max-width: 1024px) {
      .app-layout { flex-direction: column; height: auto; padding: 1rem 0; }
      .chessboard { width: 92vw; height: 92vw; max-width: 500px; max-height: 500px; }
      .sidebar { width: 92vw; max-width: 500px; height: auto; }
    }
  </style>
</head>
<body>

  <div class="app-layout">
    
    <!-- 2D Centered Chessboard -->
    <div class="board-container">
      <div id="chessboard" class="chessboard"></div>
    </div>

    <!-- Chess.com Vibe Side Panel -->
    <div class="sidebar">
      <div>
        <div class="brand-header">
          <img id="brandIcon" src="assets/donkey_knight.png" alt="Donkey Knight">
          <h1>Chess.com 2D</h1>
        </div>

        <div class="controls-group">
          <div>
            <div class="control-label">Game Mode</div>
            <select id="gameMode" class="select-input">
              <option value="ai-easy">vs Computer (Easy)</option>
              <option value="ai-medium" selected>vs Computer (Medium)</option>
              <option value="ai-hard">vs Computer (Hard)</option>
              <option value="pvp">Pass & Play (2 Player)</option>
            </select>
          </div>

          <div>
            <div class="control-label">Player Side</div>
            <select id="playerSide" class="select-input">
              <option value="white" selected>Play as White</option>
              <option value="black">Play as Black</option>
            </select>
          </div>
        </div>

        <div class="controls-group">
          <div class="status-box">
            <div class="turn-indicator">
              <div id="turnBadge" class="turn-badge"></div>
              <span id="turnText">White's Turn</span>
            </div>
            <div id="checkBadge" class="check-badge">CHECK!</div>
            <div id="aiThinking" class="ai-thinking">⚙️ Thinking...</div>
          </div>

          <div class="captured-tray">
            <div id="capturedWhite" class="captured-row"></div>
            <div id="capturedBlack" class="captured-row"></div>
          </div>

          <div class="control-label">Move Log</div>
          <div id="moveLog" class="move-log"></div>
        </div>
      </div>

      <div class="controls-group">
        <div class="btn-row">
          <button id="btnUndo" class="btn">↩ Undo</button>
          <button id="btnFlip" class="btn">🔄 Flip</button>
        </div>
        <button id="btnNewGame" class="btn btn-primary">↻ New Game</button>
      </div>
    </div>

  </div>

  <!-- Pawn Promotion Modal -->
  <div id="promotionModal" class="modal-overlay">
    <div class="modal-card">
      <h2>Pawn Promotion</h2>
      <p style="color:#bababa; font-size:0.9rem;">Choose piece for promotion:</p>
      <div class="promo-options">
        <button class="promo-btn" data-choice="Q">
          <img src="https://upload.wikimedia.org/wikipedia/commons/1/15/Chess_qlt45.svg" alt="Queen">
          <span>Queen</span>
        </button>
        <button class="promo-btn" data-choice="R">
          <img src="https://upload.wikimedia.org/wikipedia/commons/7/72/Chess_rlt45.svg" alt="Rook">
          <span>Rook</span>
        </button>
        <button class="promo-btn" data-choice="B">
          <img src="https://upload.wikimedia.org/wikipedia/commons/b/b1/Chess_blt45.svg" alt="Bishop">
          <span>Bishop</span>
        </button>
        <button class="promo-btn" data-choice="N">
          <img src="assets/donkey_knight.png" alt="Donkey Knight">
          <span>Knight</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Game Over Modal -->
  <div id="gameOverModal" class="modal-overlay">
    <div class="modal-card">
      <h2 id="gameOverTitle">Checkmate!</h2>
      <p id="gameOverMsg" style="color:#bababa; margin-bottom:1.5rem;">White Wins!</p>
      <button id="btnPlayAgain" class="btn btn-primary">Play Again</button>
    </div>
  </div>

  <!-- MODULE ENTRYPOINT -->
  <script type="module">
    import { ChessApp } from './js/app.js';
    window.app = new ChessApp();
  </script>
</body>
</html>

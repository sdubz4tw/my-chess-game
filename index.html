<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Antigravity Chess</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #1e1e2f;
      --square-light: #eeeed2;
      --square-dark: #769656;
      --highlight-select: rgba(255, 215, 0, 0.6);
      --highlight-move: rgba(34, 197, 94, 0.5);
      --text-primary: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: 'Outfit', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: var(--bg-primary);
      color: var(--text-primary);
      padding: 20px;
    }

    h1 {
      margin-bottom: 20px;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-size: 1.8rem;
      text-align: center;
    }

    .game-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    #chessboard {
      display: grid;
      grid-template-columns: repeat(8, 60px);
      grid-template-rows: repeat(8, 60px);
      border: 4px solid #333;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      border-radius: 4px;
      overflow: hidden;
    }

    @media (max-width: 520px) {
      #chessboard {
        grid-template-columns: repeat(8, 42px);
        grid-template-rows: repeat(8, 42px);
      }
      .square {
        width: 42px !important;
        height: 42px !important;
        font-size: 26px !important;
      }
    }

    .square {
      width: 60px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      user-select: none;
      cursor: pointer;
      position: relative;
      transition: background-color 0.15s ease;
    }

    .white-square {
      background-color: var(--square-light);
      color: #111;
    }

    .black-square {
      background-color: var(--square-dark);
      color: #111;
    }

    .square:hover {
      opacity: 0.85;
    }

    .square.selected {
      background-color: var(--highlight-select) !important;
    }

    .square.valid-move::after {
      content: '';
      width: 16px;
      height: 16px;
      background-color: var(--highlight-move);
      border-radius: 50%;
      position: absolute;
    }

    .status-panel {
      display: flex;
      align-items: center;
      gap: 15px;
      background: rgba(255, 255, 255, 0.05);
      padding: 10px 20px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .turn-text {
      font-weight: 600;
      font-size: 1rem;
    }

    .btn {
      padding: 8px 16px;
      border-radius: 6px;
      border: none;
      background: #769656;
      color: white;
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover {
      background: #5d7a42;
    }
  </style>
</head>
<body>

  <h1>♟️ Antigravity Chess</h1>
  
  <div class="game-wrapper">
    <div class="status-panel">
      <span id="turnText" class="turn-text">White's Turn</span>
      <button class="btn" onclick="resetGame()">New Game</button>
    </div>

    <div id="chessboard"></div>
  </div>

  <script>
    const PIECES = {
      'r': '♜', 'n': '♞', 'b': '♝', 'q': '♛', 'k': '♚', 'p': '♟',
      'R': '♖', 'N': '♘', 'B': '♗', 'Q': '♕', 'K': '♔', 'P': '♙'
    };

    const INITIAL_BOARD = [
      ['r','n','b','q','k','b','n','r'],
      ['p','p','p','p','p','p','p','p'],
      ['','','','','','','',''],
      ['','','','','','','',''],
      ['','','','','','','',''],
      ['','','','','','','',''],
      ['P','P','P','P','P','P','P','P'],
      ['R','N','B','Q','K','B','N','R']
    ];

    let boardState = [];
    let currentTurn = 'white';
    let selectedSquare = null;
    let validMoves = [];

    const board = document.getElementById('chessboard');

    function initGame() {
      boardState = INITIAL_BOARD.map(row => [...row]);
      currentTurn = 'white';
      selectedSquare = null;
      validMoves = [];
      renderBoard();
      updateStatus();
    }

    function isWhitePiece(p) { return p && p === p.toUpperCase(); }
    function isBlackPiece(p) { return p && p === p.toLowerCase(); }

    function getValidMoves(row, col) {
      const piece = boardState[row][col];
      if (!piece) return [];
      const isWhite = isWhitePiece(piece);
      if ((currentTurn === 'white' && !isWhite) || (currentTurn === 'black' && isWhite)) return [];

      const moves = [];
      const type = piece.toLowerCase();

      const addMove = (r, c) => {
        if (r < 0 || r > 7 || c < 0 || c > 7) return false;
        const target = boardState[r][c];
        if (!target) { moves.push({ r, c }); return true; }
        if ((isWhite && isBlackPiece(target)) || (!isWhite && isWhitePiece(target))) {
          moves.push({ r, c });
        }
        return false;
      };

      if (type === 'p') {
        const dir = isWhite ? -1 : 1;
        const startRow = isWhite ? 6 : 1;
        if (row + dir >= 0 && row + dir <= 7 && !boardState[row + dir][col]) {
          moves.push({ r: row + dir, c: col });
          if (row === startRow && !boardState[row + 2 * dir][col]) {
            moves.push({ r: row + 2 * dir, c: col });
          }
        }
        [-1, 1].forEach(dc => {
          const nr = row + dir, nc = col + dc;
          if (nr >= 0 && nr <= 7 && nc >= 0 && nc <= 7) {
            const target = boardState[nr][nc];
            if (target && ((isWhite && isBlackPiece(target)) || (!isWhite && isWhitePiece(target)))) {
              moves.push({ r: nr, c: nc });
            }
          }
        });
      } else if (type === 'n') {
        [[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]].forEach(([dr,dc]) => addMove(row+dr, col+dc));
      } else if (type === 'k') {
        for(let dr=-1; dr<=1; dr++) for(let dc=-1; dc<=1; dc++) if(dr||dc) addMove(row+dr, col+dc);
      } else {
        const dirs = (type === 'r' || type === 'q') ? [[-1,0],[1,0],[0,-1],[0,1]] : [];
        if (type === 'b' || type === 'q') dirs.push([-1,-1],[-1,1],[1,-1],[1,1]);
        dirs.forEach(([dr,dc]) => {
          let r = row+dr, c = col+dc;
          while(addMove(r,c)) { r += dr; c += dc; }
        });
      }

      return moves;
    }

    function handleSquareClick(row, col) {
      const piece = boardState[row][col];
      const isWhite = isWhitePiece(piece);

      if (piece && ((currentTurn === 'white' && isWhite) || (currentTurn === 'black' && !isWhite))) {
        selectedSquare = { row, col };
        validMoves = getValidMoves(row, col);
        renderBoard();
        return;
      }

      if (selectedSquare) {
        const isMoveValid = validMoves.some(m => m.r === row && m.c === col);
        if (isMoveValid) {
          boardState[row][col] = boardState[selectedSquare.row][selectedSquare.col];
          boardState[selectedSquare.row][selectedSquare.col] = '';
          currentTurn = currentTurn === 'white' ? 'black' : 'white';
          selectedSquare = null;
          validMoves = [];
          renderBoard();
          updateStatus();
          return;
        }
      }

      selectedSquare = null;
      validMoves = [];
      renderBoard();
    }

    function renderBoard() {
      board.innerHTML = '';
      for (let row = 0; row < 8; row++) {
        for (let col = 0; col < 8; col++) {
          const square = document.createElement('div');
          const isWhite = (row + col) % 2 === 0;
          square.className = `square ${isWhite ? 'white-square' : 'black-square'}`;
          
          if (selectedSquare && selectedSquare.row === row && selectedSquare.col === col) {
            square.classList.add('selected');
          }
          if (validMoves.some(m => m.r === row && m.c === col)) {
            square.classList.add('valid-move');
          }

          const piece = boardState[row][col];
          if (piece) {
            square.textContent = PIECES[piece];
          }

          square.onclick = () => handleSquareClick(row, col);
          board.appendChild(square);
        }
      }
    }

    function updateStatus() {
      document.getElementById('turnText').textContent = `${currentTurn.charAt(0).toUpperCase() + currentTurn.slice(1)}'s Turn`;
    }

    function resetGame() {
      initGame();
    }

    initGame();
  </script>
</body>
</html>
